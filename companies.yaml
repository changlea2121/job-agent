# Companies to poll. Each source needs its own fields:
#   greenhouse: board_token
#   workday:    workday_host, workday_site (from the careers site's apply links)
#   kpn:        base_url
# Job.category comes from:
#   category_from: departments                   -> Greenhouse departments
#   category_metadata_field: <metadata name>     -> a Greenhouse metadata entry
#   category_from: job_family_group              -> Workday "Job Category" facet
#   category_from: expertise                     -> KPN RSS category
# Omit them for no category.
companies:
  - name: adyen
    source: greenhouse
    board_token: adyen
    category_from: departments  # adyen's board has no metadata
    exclude_categories:
      - Account Management
      - Commercial Business Development
      - Sales
      - Partnerships
      - Payments Partnership
      - Marketing
      - Finance
      - People
      - Legal
      - Compliance
      - Regulatory
      - Internal Control
      - Merchant Operations
      - Strategy & Execution
      - Supply Chain
      - Procurement
      - Office Management
      - Product Management
      - UX
    # Description lines `review` leaves out of its preview (case-insensitive
    # substrings). Each appears in most adyen postings.
    boilerplate:
      - This is Adyen
      - Adyen provides payments, data, and financial products
      - For our teams, we create an environment
      - What's next?
      - Ensuring a smooth and enjoyable candidate experience
      - Our Diversity, Equity and Inclusion commitments
      - Our unique approach is a product of our diverse perspectives
      - Studies show that women and members of underrepresented communities

  - name: nebius
    source: greenhouse
    board_token: nebius
    category_metadata_field: Job Category
    exclude_categories:
      - Finance
      - HR
      - Marketing
      - Go-To-Market
      - Sales
      - Legal
      - Government Relations
      - Communications
      - Customer Experience
      - Operations
      - Supply Chain and Procurement
      - Design
    # The first group appears in every nebius posting; the rest are older or
    # team-specific intro variants, each in 3-15 postings.
    boilerplate:
      - About Nebius
      - Nebius is leading a new era in cloud  # "... infrastructure" and "... computing"
      - Built by engineers, for engineers
      - Listed on Nasdaq (NBIS)
      - What's it like to work at Nebius
      - Fast moving - Bold thinking - Constant growth
      - Benefits & Perks
      - Competitive compensation
      - Career growth and learning opportunities
      - International environment and talented teams
      - Flexibility and ownership
      - Collaborative and innovative culture
      - Opportunity to work on impactful AI projects
      - Equal Opportunity Statement
      - Nebius is an equal opportunity employer
      - Applicants must be authorized to work in the country
      - If you need accommodations during the application process
      - Nebius AI is built with the talent of more than 500 highly skilled engineers
      - Headquartered in Amsterdam and listed on Nasdaq, Nebius has a global footprint
      - headquarters are in Amsterdam, Netherlands, with teams working out of R&D hubs
      - Nebius AI owns a data center in Finland
      - Nebius AI is an AI cloud platform with one of the largest GPU capacities
      - Why work at Nebius
      - Why Join Nebius
      - Join Nebius Today!
      - growing and expanding our products every day
      - About Tavily
      - Why Tavily?
      - Tavily, part of Nebius, is the web access layer for AI agents

  # Unofficial Workday JSON API (decision 23). ICSGBLCOR is the global site;
  # ICSNLDGEN only holds a subset of the same jobs.
  - name: ing
    source: workday
    workday_host: ing.wd3.myworkdayjobs.com
    workday_site: ICSGBLCOR
    category_from: job_family_group
    # Kept for now: Tech; Data, Modelling & Analytics; Security; Transformation;
    # Risk Management (model developer, Risk AI Data Scientist: left to
    # labelling); Financial Crime & Fraud Prevention; Additional JFG; and
    # Trainee JFG (internships are grouped, not excluded).
    exclude_categories:
      - Relationship Management       # private banking, relatiemanagers
      - Client & Business Services    # retail advisers (hypotheek, vermogen)
      - Customer Experience
      - Communications & Brand Experience
      - Procurement
      - Legal & Corporate Governance
      - HR
      - Finance
      - Compliance
      - Audit JFG
      - Group Treasury
      - Corporate & Facility Services
      - Business & Wholesale Banking Specialism
      - Business Support & Business Management
    boilerplate:
      - Curious about how ING empowers people and businesses to move forward
      - Discover what we do and what we can offer you
      - The benefits of working with us at ING include
      - De voordelen van werken bij ING zijn onder andere
      - "We want to make sure that it's possible for you to strike the right balance"
      - We hire smart people like you for your potential
      - Personal growth and challenging work with endless possibilities
      - An informal working environment with innovative colleagues
      - 13th month salary
      - 8% Holiday payment
      - 25-28 vacation days depending on contract
      - Contact the recruiter attached to the advertisement
      - Please visit our Frequently Asked Questions section
      - Every year, more than 350 students join our internship program
      - Whatever happens, an internship at ING is the ideal opportunity
      - This is a great opportunity to train with highly skilled people

  # The site's RSS feed and internal JSON API, joined (decision 24).
  - name: kpn
    source: kpn
    base_url: https://jobs.kpn.com
    category_from: expertise
    # Kept: Engineering, Network Engineering, IT Management, Security, and
    # Stages (internships are grouped, not excluded).
    exclude_categories:
      - Winkels                      # shops
      - Monteurs                     # field technicians
      - Klantenservice
      - Sales & Accountmanagement
      - Marketing & Communicatie
      - Business support
      - Strategie
      - Project & Productmanagement
    # Benefits blocks, in most KPN postings.
    boilerplate:
      - Bij KPN hebben we recruitmenttalent
      - Natuurlijk hebben we als werkgever jou ook veel te bieden
      - Ons geloof in technologie is groot
      - Jaarlijks een individuele en collectieve verhoging
      - Flexibele vrije dagen
      - vaste 13e maand
      - 50% korting op
      - per jaar aan inzetbaarheidsbudget
      - opleidingsbudget per jaar
      - Thuiswerkshop
      - Goede reiskostenvergoeding
      - Mogelijkheid tot het aanschaffen van een leasefiets
      - Uitstekende pensioenvoorwaarden
      - Een goede werk-privé balans
      - Stagevergoeding van
      - Een stagevergoeding van
      - Word onderdeel van het JongKPN netwerk
      # These leaked into review previews via "werkervaring", "jaar" or "kennis".
      - Een bruto maandsalaris       # several salary-range variants
      - FLEX & BOOST                 # "... volgende jaar. Óf je zet het in voor een FLEX & BOOST doel"
      - netwerk van experts bij KPN  # internship perks
      - Breid jouw kennis & skills uit door onze KPN Academy

# Applied by `job_agent new` at output time to all companies. Case-insensitive,
# whole words: "sr" matches "Sr." but not "SRE". `exceptions` are phrases
# removed from the title first, so "Member of Technical Staff" is kept.
# `exclude_titles` removes roles whatever their seniority, internships
# included; it is checked after `exclude_seniority`.
# Jobs left whose title has an `internship` keyword are listed in their own
# section, not excluded. `internship_dutch` keywords ("stage") count only when
# the title also has a Dutch cue such as "(m/v)" or "bij", or starts with the
# keyword ("Stage ING Private Banking"), since in English "stage" usually means
# a phase ("Early-Stage").
title_filter:
  exclude_seniority:
    - senior
    - sr
    - staff
    - lead
    - leader
    - principal
    - manager
    - director
    - head of
    - vp
    - vice president
    - chief
    - directeur
    - regiodirecteur
    - teamleider
    - hoofd  # Dutch "head (of)"; whole words, so not "Hoofddorp"
  exceptions:
    - member of technical staff
  internship:
    - intern
    - internship
    - graduate
    - trainee
    - working student
    - werkstudent
    - afstudeerstage
    - meewerkstage
    - stagiair  # also "stagiair(e)"
    - stagiaire
  internship_dutch:
    - stage
  # Only roles that never fit. Data analyst / data scientist are left to
  # labelling: whether they fit depends on the actual work.
  exclude_titles:
    - business analyst
    - technician  # IT helpdesk, data center, cabling: physical/IT support work
    - mechanical  # data center design and operations
    - electrical

# Applied by `job_agent new` after the title rules: excludes jobs whose
# description requires at least `min_years` (default 3) of experience. The
# lower bound of a range counts ("3-5 years" -> 3). Ignored: years in a
# nice-to-have section or softened ("ideally 4+ years", "is a plus"), and years
# that a degree other than a PhD can replace ("3+ years or an MSc").
experience_filter:
  min_years: 3

# Applied by `job_agent new` at output time; all jobs are stored regardless.
# Case-insensitive, whole words, checked per ";"-separated location.
#   match:   any of these -> the job is shown
#   unclear: only one of these (plus "Remote"/"Hybrid") -> shown, marked
#            "location unclear". "Eindhoven, Netherlands" is not unclear.
location_filter:
  match:
    - amsterdam
    - amstelveen
    - schiphol
    - hoofddorp
    - haarlemmermeer
    - haarlem
    - leiden
    - the hague
    - den haag
    - "'s-gravenhage"
    - rijswijk
    - delft
    - zoetermeer
    - rotterdam
    - utrecht
    - diemen
    - amersfoort  # most KPN tech roles
    - hilversum
  unclear:
    - netherlands
    - nederland

# Reasons for `label` and `review`, name -> description; `review` lists them
# numbered in this order. "no" needs at least one reason, "maybe" may have
# some, "yes" none. Choosing "other" asks for a short note.
label_reasons:
  dutch_required: >-
    only an explicit C1/C2 or native/moedertaal Dutch requirement. A
    working-level "Dutch is required" doesn't count (I'm learning Dutch);
    "Nederlands en Engels" or a posting written in Dutch never counts.
    Judge those on the other criteria.
  wrong_direction: >-
    the actual work is not backend/platform/infra or ML/AI engineering.
    Judge by the description, not the title. For full-time jobs,
    analysis-focused DA/DS work counts as wrong direction; for internships
    it doesn't.
  too_senior: senior-level scope even if the title doesn't say so
  experience_required: 3+ years or explicitly senior experience (1-3 years does NOT count)
  other: anything else (prompts for a note)

# `review` previews a description by first listing its lines that contain one
# of these words (case-insensitive, whole words), then the start of the text
# if there is room. Requirements usually sit far below the company intro.
preview_keywords:
  - years
  - experience
  - dutch
  - nederlands
  - degree
  - required
  - must
  - experienced
  - requirement
  - requirements
  - fluent
  - native
  - proficiency
  - bachelor
  - master
  - msc
  - phd
  - jaar
  - ervaring
  - werkervaring
  - minimaal
  - vereist
  - kennis
  - opleiding
